baseURL: https://gimalph.github.io/
title: Tatsuya Gima
defaultContentLanguage: ja
timeZone: Asia/Tokyo
enableRobotsTXT: true
outputs:
  home: [HTML, JSON]

languages:
  ja:
    label: 日本語
    weight: 1
    title: 儀間 達也 (Tatsuya Gima)
    menus:
      main:
        - {name: 履歴書, pageRef: /about, weight: 1}
        - {name: 研究業績, pageRef: /research, weight: 2}
        - {name: 研究費, pageRef: /funding, weight: 3}
        - {name: News, pageRef: /news, weight: 4}
  en:
    label: English
    weight: 2
    menus:
      main:
        - {name: CV, pageRef: /about, weight: 1}
        - {name: Publications, pageRef: /research, weight: 2}
        - {name: Funding, pageRef: /funding, weight: 3}
        - {name: News, pageRef: /news, weight: 4}

module:
  mounts:
    - source: content
      target: content
      files: ['! en/**']
      sites:
        matrix:
          languages: [ja]
    - source: content/en
      target: content
      sites:
        matrix:
          languages: [en]

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)'], ['$', '$']]
